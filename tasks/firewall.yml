---
- name: UFW - Rate-limit SSH connections
  community.general.ufw:
    rule: limit
    name: OpenSSH

- name: UFW - Enable and deny by default
  community.general.ufw:
    state: enabled
    default: deny

- name: UFW - Allow HTTP
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: UFW - Allow HTTPS
  community.general.ufw:
    rule: allow
    port: '443'
    proto: tcp

- name: Write fail2ban jail config
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime  = 1h
      findtime = 10m
      maxretry = 5
      banaction = ufw

      [sshd]
      enabled  = true
      port     = ssh
      logpath  = %(sshd_log)s
      backend  = %(sshd_backend)s
      maxretry = 3

      [recidive]
      enabled  = true
      logpath  = /var/log/fail2ban.log
      banaction = ufw
      bantime  = 1w
      findtime = 1d
      maxretry = 5
    owner: root
    group: root
    mode: '0644'
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
