{% extends "admin/base_site.html" %}

{% load i18n %}

{% block content %}
  <form method="post">
    {% csrf_token %}
    <p>
      Se enviará el correo a las inscripciones seleccionadas. Podés agregar una
      dirección en CC para una persona administrativa.
    </p>
    {{ form.as_p }}
    {% for obj in queryset %}
      <input type="hidden" name="{{ action_checkbox_name }}" value="{{ obj.pk }}" />
    {% endfor %}
    <input type="hidden" name="action" value="{{ action_name }}" />
    <input type="hidden" name="apply" value="1" />
    <div class="submit-row">
      <input type="submit" value="{% trans "Enviar" %}" class="default" />
    </div>
  </form>
{% endblock content %}
